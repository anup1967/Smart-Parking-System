<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking System AI</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1b1b1b, #0f172a);
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left {
            flex: 2;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid rgba(255, 255, 255, 0.05);
        }

        .left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
        }

        .metric {
            width: 80%;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .metric:hover {
            transform: scale(1.03);
        }

        .metric h1 {
            font-size: 3rem;
            margin: 0;
        }

        .metric span {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }

    </style>
</head>
<body>
    <div class="left">
        <img src="{{ url_for('video_feed') }}" alt="Live Feed">
    </div>

    <div class="right">
        <h2>SMART PARKING DASHBOARD</h2>
        <div class="metric" id="freeBox">
            <h1 id="free">0</h1>
            <span>Free Slots</span>
        </div>
        <div class="metric" id="occBox">
            <h1 id="occupied">0</h1>
            <span>Occupied</span>
        </div>
        <div class="metric" id="totalBox">
            <h1 id="total">0</h1>
            <span>Total Slots</span>
        </div>
    </div>

    <script>
        async function updateStatus() {
            const res = await fetch('/status');
            const data = await res.json();
            document.getElementById('free').textContent = data.free;
            document.getElementById('occupied').textContent = data.occupied;
            document.getElementById('total').textContent = data.total;
        }
        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</body>
</html>
